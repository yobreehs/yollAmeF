name: Android Release CI

on:
  push:
    tags:
      - '*.*.*'
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - uses: actions/checkout@v6
      with:
        submodules: true

    - name: set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Write key
      run: |
        echo KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} > signing.properties
        echo KEYSTORE_ALIAS=${{ secrets.KEYSTORE_ALIAS }} >> signing.properties
        echo KEYSTORE_ALIAS_PASSWORD='${{ secrets.KEYSTORE_ALIAS_PASSWORD }}' >> signing.properties
        echo KEYSTORE_FILE=../key.jks >> signing.properties
        echo ${{ secrets.KEYSTORE }} | base64 --decode > key.jks

    - name: Build Release
      run: ./gradlew assembleRelease

    - name: Publish
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG=${GITHUB_REF#refs/tags/}
        if [ -z "$TAG" ] || [ "$TAG" = "$GITHUB_REF" ]; then
          TAG=manual-$(git rev-parse --short HEAD)
        fi
        cd app/build/outputs/apk/release/
        mv app-release.apk FemAlloy-${TAG}.apk
        if gh release view ${TAG} >/dev/null 2>&1; then
          gh release upload ${TAG} FemAlloy-${TAG}.apk --clobber
        else
          gh release create ${TAG} FemAlloy-${TAG}.apk --generate-notes
        fi
